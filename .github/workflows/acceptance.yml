name: 验收检查
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACCEPTANCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  MODEL_API_KEY: ''

jobs:
  python:
    name: Python 回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACCEPTANCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: 安装项目及测试依赖
        run: python -m pip install '.[dev,rag]' pytest-asyncio==1.2.0
      - name: 运行已有测试
        run: python -m pytest -q --junitxml=reports/pytest.xml --cov=agent_workflow --cov-report=xml:reports/coverage.xml
      - name: 保留环境与提交信息
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/revision.txt
          python -m pip freeze > reports/python-environment.txt
          python --version > reports/python-version.txt
          find reports -type f ! -name SHA256SUMS -exec sha256sum {} \; > reports/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-${{ env.ACCEPTANCE_REVISION }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  web:
    name: 前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACCEPTANCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - name: 类型检查及构建
        working-directory: web
        run: |
          set -o pipefail
          mkdir -p ../reports
          npm run build 2>&1 | tee ../reports/web-build.log
      - name: 保留环境与提交信息
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/revision.txt
          node --version > reports/node-version.txt
          sha256sum web/package-lock.json > reports/dependencies.sha256
          find reports -type f ! -name SHA256SUMS -exec sha256sum {} \; > reports/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-${{ env.ACCEPTANCE_REVISION }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  security:
    name: Python 静态安全
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACCEPTANCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install bandit==1.8.6
      - name: 扫描全部业务源码，保留原始规则结果
        run: |
          mkdir -p reports
          bandit -r src -f json -o reports/bandit.json
      - name: 保留环境与提交信息
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/revision.txt
          python -m pip freeze > reports/python-environment.txt
          find reports -type f ! -name SHA256SUMS -exec sha256sum {} \; > reports/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-${{ env.ACCEPTANCE_REVISION }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: acceptance/scoped
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: always()
    needs: [python, web, security]
    steps:
      - name: 汇总限定范围检查
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          passed = all(item['result'] == 'success' for item in results.values())
          summary = ['## 验收检查（限定范围）', '', '提交：`' + os.environ['ACCEPTANCE_REVISION'] + '`', '', '| 检查 | 结果 |', '|---|---|']
          summary += [f"| {name} | {item['result']} |" for name, item in results.items()]
          summary += ['', '范围：已有 Python 测试、前端构建、Bandit 静态检查。', '不代表完整业务验收；真实模型调用、浏览器业务流程、负载与恢复未纳入本工作流。', '失败、取消、跳过均不能放行。原始报告与环境记录保存在各 job 的工件中。']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary) + '\n')
          raise SystemExit(0 if passed else 1)
          PY
